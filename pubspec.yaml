name: study_buddy
description: A Study Buddy application for KMITL students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_generative_ai: ^0.4.7
  shared_preferences: ^2.5.6
  firebase_core: ^3.0.0
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  sqflite: ^2.4.5
  path: ^1.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# ตั้งค่าสร้าง App Icon บนแท็บเล็ตและมือถือ
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21